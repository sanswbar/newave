<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d0d0f; color: #f2f2f2; height: 100vh; display: flex;
  }
  #login {
    margin: auto; text-align: center; padding: 2rem;
  }
  #login input {
    padding: 0.6rem 0.9rem; border-radius: 8px; border: 1px solid #333;
    background: #1a1a1d; color: #fff; font-size: 1rem; width: 240px;
  }
  #login button {
    margin-left: 0.5rem; padding: 0.6rem 1.2rem; border-radius: 8px; border: none;
    background: #FC7342; color: #fff; font-weight: 600; cursor: pointer;
  }
  #app { display: none; width: 100%; height: 100%; }

  /* ── Lista de conversaciones ── */
  #sidebar {
    width: 320px; border-right: 1px solid #222; flex-shrink: 0;
    display: flex; flex-direction: column;
  }
  #sidebarTop { padding: 1rem; border-bottom: 1px solid #222; }
  #sidebarTop h1 { font-size: 0.95rem; margin: 0 0 0.75rem; display: flex; align-items: center; }
  #buscador {
    width: 100%; padding: 0.5rem 0.7rem; border-radius: 8px;
    border: 1px solid #2a2a2f; background: #16161a; color: #eee; font-size: 0.85rem;
  }
  #buscador::placeholder { color: #666; }
  #filtros { display: flex; gap: 0.3rem; margin-top: 0.6rem; flex-wrap: wrap; }
  .filtro {
    background: none; border: 1px solid #2a2a2f; color: #999; border-radius: 20px;
    padding: 0.2rem 0.65rem; font-size: 0.72rem; cursor: pointer;
  }
  .filtro.on { border-color: #FC7342; color: #FC7342; }
  #listaConversaciones { flex: 1; overflow-y: auto; }
  .conv-item {
    padding: 0.85rem 1rem; border-bottom: 1px solid #1a1a1d; cursor: pointer;
  }
  .conv-item:hover { background: #17171a; }
  .conv-item.active { background: #1f1f23; }
  .conv-nombre { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 0.4rem; }
  .conv-numero { font-size: 0.75rem; color: #888; margin-top: 2px; }
  .conv-preview { font-size: 0.8rem; color: #aaa; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-hora { font-size: 0.7rem; color: #666; margin-top: 4px; }
  .punto { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .punto.buena { background: #4ade80; }
  .punto.revisar { background: #fbbf24; }
  .punto.convirtio { background: #FC7342; }
  #vacio { padding: 2rem 1rem; text-align: center; color: #666; font-size: 0.85rem; }

  /* ── Chat ── */
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chatHeader {
    padding: 0.85rem 1rem; border-bottom: 1px solid #222;
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
  }
  #chatHeaderText { font-weight: 600; font-size: 0.9rem; }
  #acciones { margin-left: auto; display: flex; gap: 0.35rem; align-items: center; }
  .tag {
    background: none; border: 1px solid #2a2a2f; color: #999; border-radius: 20px;
    padding: 0.25rem 0.7rem; font-size: 0.73rem; cursor: pointer;
  }
  .tag:hover { border-color: #444; color: #ccc; }
  .tag.on.buena { border-color: #4ade80; color: #4ade80; }
  .tag.on.revisar { border-color: #fbbf24; color: #fbbf24; }
  .tag.on.convirtio { border-color: #FC7342; color: #FC7342; }
  #borrarBtn {
    background: none; border: 1px solid #3a2020; color: #a55; border-radius: 6px;
    padding: 0.25rem 0.6rem; font-size: 0.73rem; cursor: pointer;
  }
  #borrarBtn:hover { border-color: #a33; color: #f88; }
  #chatWrap { flex: 1; display: flex; min-height: 0; }
  #chatBody { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.6rem; }
  #chatEmpty { margin: auto; color: #666; }
  .msg { max-width: 70%; padding: 0.6rem 0.9rem; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; white-space: pre-wrap; }
  .msg.user { align-self: flex-start; background: #1f1f23; }
  .msg.assistant { align-self: flex-end; background: #FC7342; color: #fff; }
  .msg-hora { font-size: 0.65rem; color: #888; margin-top: 3px; }

  /* ── Panel del lead ── */
  #lead {
    width: 260px; border-left: 1px solid #222; padding: 1.25rem 1rem;
    overflow-y: auto; flex-shrink: 0; display: none;
  }
  #lead h2 {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: #666; margin: 0 0 1rem; font-weight: 600;
  }
  .campo { margin-bottom: 1rem; }
  .campo-label { font-size: 0.68rem; color: #777; text-transform: uppercase; letter-spacing: 0.05em; }
  .campo-valor { font-size: 0.85rem; color: #e8e8e8; margin-top: 0.2rem; line-height: 1.45; }
  #leadVacio { color: #666; font-size: 0.8rem; line-height: 1.5; }
  #refreshBtn {
    background: none; border: 1px solid #333; color: #ccc; border-radius: 6px;
    padding: 0.3rem 0.7rem; font-size: 0.75rem; cursor: pointer; margin-left: auto;
  }

  /* ── Pestañas y métricas ── */
  #tabs { display: flex; gap: 0.4rem; padding: 0.75rem 1rem 0; border-bottom: 1px solid #222; }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: #888; padding: 0.5rem 0.4rem 0.7rem; font-size: 0.85rem; cursor: pointer;
  }
  .tab.on { color: #fff; border-bottom-color: #FC7342; }
  /* Paleta del embudo: un color por paso, validada para fondo oscuro
     (banda de luminosidad, separación para daltonismo y contraste). */
  :root {
    --paso-leads:  #e05a2b;
    --paso-clicks: #0284c7;
    --paso-trials: #059669;
    --ink:         #f2f2f2;
    --ink-2:       #9aa0a8;
    --ink-3:       #6b7178;
    --linea:       #232327;
    --superficie:  #141418;
  }
  #vistaMetricas { display: none; flex: 1; overflow-y: auto; padding: 2rem 2rem 4rem; }
  #vistaVacantes { display: none; flex: 1; overflow-y: auto; padding: 2rem 2rem 4rem; }

  /* ── Vacantes ── */
  .vac-head { max-width: 940px; margin-bottom: 1.5rem; }
  .vac-head h2 { font-size: 1.15rem; font-weight: 600; margin: 0 0 0.3rem; }
  .vac-head p  { font-size: 0.82rem; color: var(--ink-3); margin: 0 0 1.1rem; max-width: 60ch; }
  .vac-btn {
    background: #FC7342; color: #fff; border: 0; border-radius: 6px;
    padding: 0.7rem 1.4rem; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .vac-btn:hover:not(:disabled) { background: #e85f2e; }
  .vac-btn:disabled { opacity: 0.5; cursor: default; }
  .vac-btn.sec { background: transparent; border: 1px solid var(--linea); color: var(--ink-2); }
  .vac-btn.sec:hover:not(:disabled) { background: var(--superficie); color: var(--ink); }
  .vac-acciones { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .vac-cat { max-width: 940px; margin-bottom: 1.75rem; }
  .vac-cat h3 { font-size: 0.95rem; font-weight: 600; margin: 0 0 0.6rem; }
  .vac-item {
    display: flex; gap: 0.7rem; align-items: flex-start;
    padding: 0.55rem 0.7rem; border-radius: 5px;
  }
  .vac-item:hover { background: var(--superficie); }
  .vac-item input { margin-top: 0.25rem; cursor: pointer; flex-shrink: 0; }
  .vac-item label { cursor: pointer; font-size: 0.87rem; line-height: 1.45; }
  .vac-emp { font-weight: 600; }
  .vac-loc { color: var(--ink-3); font-size: 0.78rem; }
  .vac-item a { color: var(--ink-3); font-size: 0.75rem; text-decoration: none; word-break: break-all; }
  .vac-item a:hover { color: #FC7342; text-decoration: underline; }
  #vacPost {
    max-width: 940px; margin-top: 1.5rem; background: var(--superficie);
    border: 1px solid var(--linea); border-radius: 6px; padding: 1.1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem; line-height: 1.6; white-space: pre-wrap;
    color: var(--ink-2); max-height: 420px; overflow-y: auto;
  }
  .m-wrap { max-width: 940px; }
  .m-seccion { margin-bottom: 3rem; }
  .m-seccion h3 {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-3); margin: 0 0 1.1rem; font-weight: 600;
  }
  .m-head { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1.1rem; }
  .m-head h3 { margin: 0; }
  .m-head .sub { font-size: 0.75rem; color: var(--ink-3); }

  /* ── Bloques: agrupan varias secciones bajo un mismo tema ──
     Sin esto todas las secciones se leen al mismo nivel y a partir de 6 ya
     no se distingue qué responde cada una. El título del bloque va grande y
     en color de tinta fuerte, al revés que los h3 de sección (chicos, gris,
     en mayúsculas), para que la jerarquía se lea de un vistazo. */
  .m-bloque { margin-bottom: 3.5rem; }
  .m-bloque + .m-bloque { border-top: 1px solid var(--linea); padding-top: 2.5rem; }
  .m-bloque-head { margin-bottom: 1.75rem; }
  .m-bloque-head h2 {
    font-size: 1.15rem; font-weight: 600; color: var(--ink);
    margin: 0 0 0.3rem; letter-spacing: -0.01em;
  }
  .m-bloque-head p { font-size: 0.82rem; color: var(--ink-3); margin: 0; max-width: 60ch; }

  /* ── Embudo: un renglón por paso, ancho proporcional ── */
  /* El ancho reservado a la derecha evita que la nota de % se corte cuando
     la barra es corta (el caso de Trials, que es el paso más angosto). */
  .embudo { display: flex; flex-direction: column; gap: 0.55rem; padding-right: 15rem; }
  .paso { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 1rem; }
  .paso-label { font-size: 0.8rem; color: var(--ink-2); text-align: right; }
  .paso-barra { position: relative; height: 38px; }
  .paso-fill {
    height: 100%; border-radius: 4px; display: flex; align-items: center;
    padding: 0 0.8rem; min-width: 3.5rem; transition: width 0.4s ease;
  }
  .paso-num { font-size: 1.05rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .paso-pct {
    position: absolute; left: calc(100% + 0.7rem); top: 50%; transform: translateY(-50%);
    font-size: 0.78rem; color: var(--ink-3); white-space: nowrap;
  }

  /* ── Periodos ── */
  .periodos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.6rem; }
  .periodo {
    background: var(--superficie); border: 1px solid var(--linea);
    border-radius: 10px; padding: 0.9rem 1rem;
  }
  .p-label { font-size: 0.72rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
  .p-num { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 0.35rem; font-variant-numeric: tabular-nums; }
  .p-detalle { font-size: 0.75rem; color: var(--ink-2); margin-top: 0.4rem; display: flex; gap: 0.7rem; }
  .p-detalle b { font-weight: 600; color: var(--ink); }
  .pill { display: inline-flex; align-items: center; gap: 0.3rem; }
  .pill i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }

  /* ── Barras comparables (segmentos y correos) ── */
  .filas { display: flex; flex-direction: column; gap: 0.15rem; }
  .fila {
    display: grid; grid-template-columns: 1fr 150px 78px; align-items: center;
    gap: 1rem; padding: 0.55rem 0.6rem; border-radius: 6px;
  }
  .fila:hover { background: #16161a; }
  .f-nombre { font-size: 0.85rem; color: var(--ink); }
  .f-sub { font-size: 0.72rem; color: var(--ink-3); margin-top: 0.1rem; }
  .f-barra { height: 7px; background: #1c1c20; border-radius: 4px; overflow: hidden; }
  .f-barra span { display: block; height: 100%; border-radius: 4px; }
  .f-pct { text-align: right; font-size: 0.9rem; font-variant-numeric: tabular-nums; font-weight: 600; }

  #metricasError { color: #ff8a6b; font-size: 0.85rem; line-height: 1.6; max-width: 600px; }
  .nota { color: var(--ink-3); font-size: 0.75rem; margin-top: 0.9rem; line-height: 1.55; max-width: 620px; }
  .vacio-m { color: var(--ink-3); font-size: 0.85rem; padding: 0.5rem 0; }

  @media (max-width: 900px) {
    #lead { display: none !important; }
    #vistaMetricas { padding: 1.25rem 1rem 3rem; }
    .embudo { padding-right: 0; }
    .paso-pct { position: static; transform: none; display: block; margin-top: 0.25rem; }
    .paso { grid-template-columns: 68px 1fr; gap: 0.6rem; align-items: start; }
    .fila { grid-template-columns: 1fr 70px; gap: 0.6rem; }
    .fila .f-barra { display: none; }
  }
</style>
</head>

<div id="app">
  <div id="sidebar">
    <div id="sidebarTop">
      <h1><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAYAAADimHc4AAAAAXNSR0IArs4c6QAAAHhlWElmTU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAIdpAAQAAAABAAAATgAAAAAAAAEsAAAAAQAAASwAAAABAAOgAQADAAAAAQABAACgAgAEAAAAAQAAAGCgAwAEAAAAAQAAAGAAAAAA/F8bUgAAAAlwSFlzAAAuIwAALiMBeKU/dgAABSNJREFUeAHtnc+O1DgQh6dZBFrQXOCABCwvsELaw47EDQQCXoIDEs+wWk54Zh4DaaV9kV1x44K4AA/AiH8SzB4XgVjNfkV3Wp4oie3EjuN0lVS0kzjl8vdLum13h9naKsSOjo628QPcZa+psF1It7ZOlJLoXPNUATIrqwKoAJkJZG5e7wAVIDOBzM3rHaACZCYwsHnmHA/xOwPDTP90mVzhk5qIkY/BxQ7xG9OnOCBDOjgpAcjH4LbNWwR6OhkByMXY5K3yJ8rzvBPo2CQEIA+Dd9k8RaDH2QUgB9NF3jo2PxHoXFYBaN9YgH2Kh1S66/rY03mAixDHAWl42fWoalc5x8Yv9o6iy0DIcgcIfLyPPSoaeD15CIwuAG2aPuQ5Z17wRQw6NaoAtGfwPjY/+GMLAHXThzznzBP+mAIofKHdYIBJ/hak8BvAV7tSC6DwK9ItrykFUPgt0O3dqQRQ+DbljnIKARR+B/D6odgCKPw6Ycd2LAGIcwrfx/vYfMf5Dv7RZsJQv4S/70F/c+GLOACLNg8g1g7+NkCEzYYfW4BVvF89RVD4KQTwFEHhCygxrtZob0HLiMt/idt2Jyj8GqgkAkgbDSIofBv+ClIyASwR5OmavXrbKbdPpgweOfYp4p2OHHMdbrFYPAP+NXZ8WO8coVCSAJfgIV90JzNEeJ8seEvgkn4VcYs+lHTBtCA/vrsIAXhr+JG0HxxPfR5bRQgA6t/wn+eBvLBecPXfw7/ivlbUc8KTlQPaZ/FHeAh8EUmeITg72Y7VEjtJslN5qnxBbjLUvIzfxO/jV/HKjij8i8trl0kdmTMU8fYqo4pXXb0Z+ZiM88/jPzS0K2DlUaC3DcfsXRfYeILLB/fkTQT4afJZLhOUK/+Asfqbrny58v/j+BW8CAGKuE0t4E13hnX4e1HqiAhFWGkCFAE1JEkVIIRWgroqQAKoISFVgBBaCeqqAAmghoQsSQDf0U0xIyARSuYBByGKZaz7mbYvMs53DUXlewOZVTeZiHOIf2k6mGPfYkJLEa7+y/rOE1wAd5nAP4PbIrxg+0/8b1wmcl9x15IGVdTWBLhQZHHO5z/roNraZCFPFvSKWZxbd3hqBSDKApssNfuawL83tX4Umw8wQwXQn5bEVDtQgJfU18W4mAIExvqDVVMZNU3eSpoH+ML8RsW/fCvnrjeqALwtyLD3YuJO/0N815c2iVPwDz+qAKS1hz9FhB3/FINryiRLxvlqNgGgG7wyeTgiSATq+46CZK4wle+5bQT5ygAxeN2CROBkFaCPhIAzdfLW9jvKXncC9VSAUAGAZnCXed0JBFEBQgQAmHGRt447RaCuCuArALCMBde3KI+Otq50cmyWAkQfhgLKINSur1hWvceUP1rbWgwlIPDxPuZcOCPoLO+AUMat9QFk+pDnHCd8aZR6KkAbfeAYvI95wVcB2sgvr0zThzzneMNXAVoEAOIo8FWABgHGhK8C1AQYG74KYAmQA74KsBIgF3wVAAI54W+8ALnhb7QAwJe/k9XHgsb5ArnLSGCWM2GfxbjngJEvukPM8LOQ/ZATtG4HAa6+67j8YRofi3rlV2nR8CzvgKp/zlcAXMddIiSBL8ltvAArCF0iJIOvAgiBlXElNomQFL40rXdApcAShohwiIslh68CWPCrIuBv479X26lfaWuzP4RTA3bFn6sAPvMAFxs9PoCACjAAXoxTVYAYFAfEUAEGwItxqgoQg+KAGCrAAHgxTlUBYlAcEON/lxSLARay0RMAAAAASUVORK5CYII=" alt="" style="width:18px;height:18px;margin-right:0.5rem;flex-shrink:0" />Conversaciones <button id="refreshBtn" onclick="cargarLista()">Actualizar</button></h1>
      <input id="buscador" placeholder="Buscar nombre, número o texto..." />
      <div id="filtros">
        <button class="filtro on" data-f="todas" onclick="filtrar('todas')">Todas</button>
        <button class="filtro" data-f="buena" onclick="filtrar('buena')">Buenas</button>
        <button class="filtro" data-f="revisar" onclick="filtrar('revisar')">Revisar</button>
        <button class="filtro" data-f="convirtio" onclick="filtrar('convirtio')">Convirtió</button>
      </div>
    </div>
    <div id="listaConversaciones"></div>
  </div>

  <div id="chat">
    <div id="tabs">
      <button class="tab on" data-v="chats" onclick="verVista('chats')">Conversaciones</button>
      <button class="tab" data-v="metricas" onclick="verVista('metricas')">Métricas</button>
      <button class="tab" data-v="vacantes" onclick="verVista('vacantes')">Vacantes</button>
    </div>

    <div id="vistaChats" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div id="chatHeader">
        <span id="chatHeaderText">Selecciona una conversación</span>
        <div id="acciones" style="display:none">
          <button class="tag buena" data-t="buena" onclick="etiquetar('buena')">Buena</button>
          <button class="tag revisar" data-t="revisar" onclick="etiquetar('revisar')">Revisar</button>
          <button class="tag convirtio" data-t="convirtio" onclick="etiquetar('convirtio')">Convirtió</button>
          <button id="borrarBtn" onclick="borrarConversacionActiva()">Borrar</button>
        </div>
      </div>
      <div id="chatWrap">
        <div id="chatBody"><div id="chatEmpty">Elige un lead de la izquierda para ver el chat</div></div>
        <div id="lead"></div>
      </div>
    </div>

    <div id="vistaMetricas"></div>
    <div id="vistaVacantes"></div>
  </div>
</div>

<script>
  let CLAVE = '';
  let activo = null;
  let etiquetaActiva = null;
  let filtroActual = 'todas';
  let conversaciones = [];

  function entrar() {
    CLAVE = document.getElementById('clave').value;
    if (!CLAVE) return;
    cargarLista();
  }

  document.getElementById('clave').addEventListener('keydown', e => {
    if (e.key === 'Enter') entrar();
  });

  // Espera a que dejes de teclear antes de pegarle a la DB, si no se dispara
  // una consulta por cada letra.
  let debounce;
  document.getElementById('buscador').addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(cargarLista, 300);
  });

  function filtrar(f) {
    filtroActual = f;
    document.querySelectorAll('.filtro').forEach(b => {
      b.classList.toggle('on', b.dataset.f === f);
    });
    pintarLista();
  }

  async function cargarLista() {
    const q = document.getElementById('buscador').value.trim();
    const url = '/api/conversaciones?clave=' + encodeURIComponent(CLAVE) +
                (q ? '&q=' + encodeURIComponent(q) : '');
    const resp = await fetch(url);
    if (resp.status === 401) {
      document.getElementById('loginError').style.display = 'block';
      return;
    }
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';

    const data = await resp.json();
    conversaciones = data.conversaciones || [];
    pintarLista();
  }

  function pintarLista() {
    const cont = document.getElementById('listaConversaciones');
    cont.innerHTML = '';

    const visibles = filtroActual === 'todas'
      ? conversaciones
      : conversaciones.filter(c => c.etiqueta === filtroActual);

    if (!visibles.length) {
      cont.innerHTML = '<div id="vacio">Nada por aquí</div>';
      return;
    }

    visibles.forEach(c => {
      const div = document.createElement('div');
      div.className = 'conv-item' + (c.numero === activo ? ' active' : '');
      div.onclick = () => abrirConversacion(c.numero, c.nombre);
      const punto = c.etiqueta ? `<span class="punto ${c.etiqueta}"></span>` : '';
      div.innerHTML = `
        <div class="conv-nombre">${punto}${escapeHtml(c.nombre || 'Sin nombre')}</div>
        <div class="conv-numero">${escapeHtml(c.numero)}</div>
        <div class="conv-preview">${c.ultimo_rol === 'assistant' ? '🤖 ' : ''}${escapeHtml(c.ultimo_mensaje)}</div>
        <div class="conv-hora">${formatearHora(c.ultima_actividad)}</div>
      `;
      cont.appendChild(div);
    });
  }

  async function abrirConversacion(numero, nombre) {
    activo = numero;
    const conv = conversaciones.find(c => c.numero === numero);
    etiquetaActiva = conv ? conv.etiqueta : null;
    pintarLista();

    document.getElementById('chatHeaderText').textContent = (nombre || 'Sin nombre') + ' — ' + numero;
    document.getElementById('acciones').style.display = 'flex';
    pintarEtiquetas();

    const resp = await fetch('/api/conversaciones?clave=' + encodeURIComponent(CLAVE) + '&numero=' + encodeURIComponent(numero));
    const data = await resp.json();

    const body = document.getElementById('chatBody');
    body.innerHTML = '';
    data.mensajes.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.rol;
      div.innerHTML = escapeHtml(m.contenido) + '<div class="msg-hora">' + formatearHora(m.creado_en) + '</div>';
      body.appendChild(div);
    });
    body.scrollTop = body.scrollHeight;

    pintarLead(data.lead);
  }

  function pintarLead(lead) {
    const panel = document.getElementById('lead');
    panel.style.display = 'block';

    if (!lead) {
      panel.innerHTML = '<h2>Del formulario</h2><div id="leadVacio">Sin datos. Escribió por WhatsApp sin haber llenado el formulario, o lo llenó antes de que se conectara el registro.</div>';
      return;
    }

    const campos = [
      ['A qué se dedica', lead.trabajo],
      ['Por qué busca remoto', lead.razon],
      ['Inglés', lead.ingles],
      ['Qué tan listo está', lead.compromiso],
    ].filter(([, v]) => v);

    panel.innerHTML = '<h2>Del formulario</h2>' + (campos.length
      ? campos.map(([label, valor]) => `
          <div class="campo">
            <div class="campo-label">${label}</div>
            <div class="campo-valor">${escapeHtml(valor)}</div>
          </div>`).join('')
      : '<div id="leadVacio">El registro existe pero sin datos.</div>');
  }

  function pintarEtiquetas() {
    document.querySelectorAll('.tag').forEach(b => {
      b.classList.toggle('on', b.dataset.t === etiquetaActiva);
    });
  }

  async function etiquetar(etiqueta) {
    if (!activo) return;
    // Volver a picarle a la etiqueta que ya tiene la quita.
    const nueva = etiquetaActiva === etiqueta ? null : etiqueta;

    await fetch('/api/conversaciones?clave=' + encodeURIComponent(CLAVE), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ numero: activo, etiqueta: nueva }),
    });

    etiquetaActiva = nueva;
    const conv = conversaciones.find(c => c.numero === activo);
    if (conv) conv.etiqueta = nueva;
    pintarEtiquetas();
    pintarLista();
  }

  async function borrarConversacionActiva() {
    if (!activo) return;
    if (!confirm('¿Borrar toda la conversación con ' + activo + '? Esto no se puede deshacer.')) return;

    await fetch('/api/conversaciones?clave=' + encodeURIComponent(CLAVE) + '&numero=' + encodeURIComponent(activo), {
      method: 'DELETE',
    });

    activo = null;
    etiquetaActiva = null;
    document.getElementById('chatHeaderText').textContent = 'Selecciona una conversación';
    document.getElementById('acciones').style.display = 'none';
    document.getElementById('lead').style.display = 'none';
    document.getElementById('chatBody').innerHTML = '<div id="chatEmpty">Elige un lead de la izquierda para ver el chat</div>';
    cargarLista();
  }

  // ── Métricas ──────────────────────────────────────────────────────────

  function verVista(v) {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    document.getElementById('vistaChats').style.display    = v === 'chats'    ? 'flex'  : 'none';
    document.getElementById('vistaMetricas').style.display = v === 'metricas' ? 'block' : 'none';
    document.getElementById('vistaVacantes').style.display = v === 'vacantes' ? 'block' : 'none';
    document.getElementById('sidebar').style.display       = v === 'chats'    ? 'flex'  : 'none';
    if (v === 'metricas') cargarMetricas();
    if (v === 'vacantes') pintarVacantes();
  }

  async function cargarMetricas() {
    const cont = document.getElementById('vistaMetricas');
    cont.innerHTML = '<div style="color:#666">Cargando...</div>';

    const resp = await fetch('/api/metricas?clave=' + encodeURIComponent(CLAVE));
    const data = await resp.json();

    if (!resp.ok) {
      cont.innerHTML = `<div id="metricasError">
        <strong>No se pudieron cargar las métricas</strong><br>${escapeHtml(data.error || '')}
        <div class="nota">Si dice que falta APPSCRIPT_METRICAS_URL, hay que configurar esa variable en Vercel con la URL de la implementación del Apps Script.</div>
      </div>`;
      return;
    }

    // Agrupadas en tres bloques por la pregunta que responden. Con 6 secciones
    // sueltas ya no se distinguía qué era qué.
    cont.innerHTML = '<div class="m-wrap">' +
      bloque(
        'Cuánta gente entra',
        'Del formulario a Skool, y cómo se mueve el volumen por periodo.',
        seccionEmbudo(data) + seccionPeriodos(data)
      ) +
      bloque(
        'Cómo y cuándo convierten',
        'Qué tan rápido se deciden, en qué punto de la secuencia de correos entran, y cuántos habían hablado con el bot.',
        seccionVelocidad(data) + seccionCorreos(data) + seccionBot(data)
      ) +
      bloque(
        'Quién convierte mejor',
        'Los mismos leads cortados por fuente y por perfil. El porcentaje siempre es conversión a trial, no volumen.',
        seccionSegmentos(data)
      ) +
      '</div>';
  }

  // Envuelve varias secciones bajo un título común. Si el contenido viene
  // vacío (sin datos todavía), el bloque no se pinta.
  function bloque(titulo, descripcion, contenido) {
    if (!contenido.trim()) return '';
    return `<div class="m-bloque">
      <div class="m-bloque-head">
        <h2>${titulo}</h2>
        <p>${descripcion}</p>
      </div>
      ${contenido}
    </div>`;
  }

  // Cuánto tardan en decidirse. Separado de "en qué correo convierten" porque
  // responde otra pregunta: el promedio esconde que son dos públicos, unos que
  // entran el mismo día y otros que necesitan días de seguimiento.
  function seccionVelocidad(d) {
    const v = d.trialsPorVelocidad;
    if (!v) return '';
    const orden = ['El mismo día', 'En 1-2 días', 'Después de 4+ días'];
    const total = orden.reduce((s, k) => s + (v[k] || 0), 0);
    if (!total) return '';

    const colores = ['var(--paso-trials)', 'var(--paso-clicks)', 'var(--paso-leads)'];
    const filas = orden.map((k, i) => {
      const n = v[k] || 0;
      const p = pct(n, total);
      return `<div class="fila">
        <div><div class="f-nombre">${k}</div></div>
        <div class="f-barra"><span style="width:${p}%;background:${colores[i]}"></span></div>
        <div class="f-pct">${n} <span style="color:var(--ink-3);font-weight:400">· ${p}%</span></div>
      </div>`;
    }).join('');

    const rapido = pct(v['El mismo día'] || 0, total);
    const lento = pct(v['Después de 4+ días'] || 0, total);

    return `<div class="m-seccion">
      <div class="m-head"><h3>Qué tan rápido se deciden</h3><span class="sub">${total} trials</span></div>
      <div class="filas">${filas}</div>
      <div class="nota">
        Son dos públicos distintos: ${rapido}% entra el mismo día que se registra (ya venían decididos)
        y ${lento}% tarda más de 4 días, o sea que convierte gracias a la secuencia de correos.
        Por eso el promedio de "en qué correo convierten" puede engañar: acortar la secuencia
        costaría los que necesitan tiempo.
      </div>
    </div>`;
  }

  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }

  // OJO: click y trial NO son pasos consecutivos del mismo camino. El click
  // solo se registra si la persona presiona "Unirme ahora" DENTRO del
  // formulario; a Skool se puede llegar por correo, anuncio o link directo sin
  // pasar por ahí. Por eso puede haber más trials que clicks, y por eso esto
  // se muestra como dos medidas del mismo total y no como un embudo.
  function seccionEmbudo(d) {
    const t = d.total || { leads: 0, clicks: 0, trials: 0 };
    if (!t.leads) return '<div class="m-seccion"><h3>Resultados</h3><div class="vacio-m">Sin leads todavía.</div></div>';

    // El % de clicks va sobre los leads que llegaron cuando ese registro ya
    // existía (11 jul 2026), no sobre el histórico completo: los anteriores
    // tienen la columna vacía por diseño y lo diluirían.
    const tr = d.tracking;
    const baseClicks = tr && tr.leadsDesdeTracking ? tr.leadsDesdeTracking : t.leads;
    const clicksReales = tr ? tr.clicksDesdeTracking : t.clicks;
    const desde = tr && tr.clicksDesde
      ? new Date(tr.clicksDesde).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' })
      : null;

    const medidas = [
      ['Leads',  t.leads,  'var(--paso-leads)',  'registros del formulario'],
      ['Clicks', t.clicks, 'var(--paso-clicks)', pct(clicksReales, baseClicks) + '% de los ' + baseClicks + ' leads medibles' + (desde ? ' (desde ' + desde + ')' : '')],
      ['Trials', t.trials, 'var(--paso-trials)', pct(t.trials, t.leads) + '% terminó entrando a Skool'],
    ];

    const filas = medidas.map(([label, n, color, nota]) => `
      <div class="paso">
        <div class="paso-label">${label}</div>
        <div class="paso-barra">
          <div class="paso-fill" style="width:${Math.max(pct(n, t.leads), 4)}%;background:${color}">
            <span class="paso-num">${n}</span>
          </div>
          <span class="paso-pct">${nota}</span>
        </div>
      </div>`).join('');

    const cuando = d.actualizado
      ? new Date(d.actualizado).toLocaleString('es-MX', { hour: '2-digit', minute: '2-digit' })
      : '';

    // Cuando hay más trials que clicks queda claro que mucha gente entra sin
    // pasar por el botón del formulario. Vale la pena decirlo, no esconderlo.
    const masTrials = t.trials > t.clicks;

    return `<div class="m-seccion">
      <div class="m-head">
        <h3>Resultados — histórico</h3>
        ${cuando ? `<span class="sub">actualizado ${cuando}</span>` : ''}
      </div>
      <div class="embudo">${filas}</div>
      <div class="nota">
        Estas no son etapas de un mismo camino. El <b style="color:var(--ink-2)">click</b> solo se marca
        si le dieron a "Unirme ahora" dentro del formulario, y su porcentaje va sobre los leads
        posteriores a ${desde || 'que existe ese registro'}, porque los anteriores tienen la columna vacía por diseño.
        El <b style="color:var(--ink-2)">trial</b> lo marcas tú a mano cuando ves a alguien entrar a Skool,
        sin importar por dónde llegó.
        ${masTrials ? `<br><br>Por eso hay más trials (${t.trials}) que clicks (${t.clicks}): mucha gente llega a Skool por el correo, un anuncio o el link directo, sin pasar por ese botón.` : ''}
      </div>
    </div>`;
  }

  function seccionPeriodos(d) {
    const periodos = [['Hoy', d.hoy], ['Últimos 7 días', d.semana], ['Este mes', d.mes], ['Histórico', d.total]];
    const tarjetas = periodos.map(([label, p]) => {
      if (!p) return '';
      return `<div class="periodo">
        <div class="p-label">${label}</div>
        <div class="p-num">${p.leads}</div>
        <div class="p-detalle">
          <span class="pill"><i style="background:var(--paso-clicks)"></i><b>${p.clicks}</b> clicks</span>
          <span class="pill"><i style="background:var(--paso-trials)"></i><b>${p.trials}</b> trials</span>
        </div>
      </div>`;
    }).join('');

    return `<div class="m-seccion">
      <h3>Leads por periodo</h3>
      <div class="periodos">${tarjetas}</div>
      <div class="nota">
        Los trials son los que están marcados a mano en la columna Estatus del sheet, así que
        este número va atrás de la realidad hasta que marcas los del día. Si Skool muestra más,
        el que manda es Skool.
      </div>
    </div>`;
  }

  function seccionCorreos(d) {
    const m = d.trialsPorCorreo || {};
    const orden = ['Sin correo aún', 'Correo 1', 'Correo 2', 'Correo 3', 'Correo 4', 'Correo 5'];
    const conDato = orden.reduce((s, k) => s + (m[k] || 0), 0);
    const sinDato = m['Sin dato'] || 0;

    // Antes de que el script capturara este dato, marcar "trial" a mano
    // borraba el estatus y con él la información. Esos trials no tienen dato
    // y decirlo es más honesto que repartirlos en categorías inventadas.
    if (!conDato) {
      return `<div class="m-seccion">
        <div class="m-head"><h3>En qué correo convierten</h3></div>
        <div class="vacio-m">Todavía sin datos. Se empieza a registrar a partir del próximo trial que marques.</div>
        <div class="nota">Los ${sinDato} trials anteriores no tienen este dato: al marcarlos a mano se sobrescribía la columna Estatus, que era donde vivía. Ahora el script lo guarda aparte en cuanto marcas uno.</div>
      </div>`;
    }

    const max = Math.max(...orden.map(k => m[k] || 0));
    const filas = orden.map(k => {
      const n = m[k] || 0;
      return `<div class="fila">
        <div><div class="f-nombre">${k}</div></div>
        <div class="f-barra"><span style="width:${max ? (n / max) * 100 : 0}%;background:var(--paso-trials)"></span></div>
        <div class="f-pct" style="color:${n ? 'var(--ink)' : 'var(--ink-3)'}">${n} <span style="color:var(--ink-3);font-weight:400">· ${pct(n, conDato)}%</span></div>
      </div>`;
    }).join('');

    return `<div class="m-seccion">
      <div class="m-head"><h3>En qué correo convierten</h3><span class="sub">${conDato} trials con dato</span></div>
      <div class="filas">${filas}</div>
      <div class="nota">
        Cuántos correos había recibido la persona cuando marcaste su trial. No prueba que ese correo la convenciera, pero sí muestra en qué punto de la secuencia se concentran.
        ${sinDato ? `<br><br>Otros ${sinDato} trials no aparecen aquí: son anteriores a que el script guardara este dato.` : ''}
      </div>
    </div>`;
  }

  function seccionBot(d) {
    const b = d.bot;
    if (!b) return '';
    const c = d.cruce || {};
    const e = b.etiquetas || {};
    const conBot = c.trialsQueHablaronConBot || 0;
    const totalTrials = c.trialsConNumero || 0;

    return `<div class="m-seccion">
      <h3>Bot de WhatsApp</h3>
      <div class="periodos">
        <div class="periodo">
          <div class="p-label">Conversaciones hoy</div>
          <div class="p-num">${b.ultimas24h}</div>
          <div class="p-detalle"><span>${b.ultimos7d} en 7 días</span></div>
        </div>
        <div class="periodo">
          <div class="p-label">Total histórico</div>
          <div class="p-num">${b.conversaciones}</div>
          <div class="p-detalle"><span>${b.mensajes} mensajes</span></div>
        </div>
        <div class="periodo">
          <div class="p-label">Trials que hablaron con el bot</div>
          <div class="p-num" style="color:var(--paso-trials)">${conBot}</div>
          <div class="p-detalle"><span>de ${totalTrials} trials · ${pct(conBot, totalTrials)}%</span></div>
        </div>
        <div class="periodo">
          <div class="p-label">Etiquetadas</div>
          <div class="p-num">${(e.buena || 0) + (e.revisar || 0) + (e.convirtio || 0)}</div>
          <div class="p-detalle"><span>${e.buena || 0} buenas · ${e.revisar || 0} revisar</span></div>
        </div>
      </div>
      <div class="nota">"Trials que hablaron con el bot" cruza los números marcados como trial en el sheet contra los que tienen conversación. No significa que el bot los convirtiera, solo que hubo contacto.</div>
    </div>`;
  }

  function seccionSegmentos(d) {
    const segs = d.segmentos || {};
    // "fuente" va primero: es el corte más accionable ahora que corren Google
    // Ads y Meta en paralelo. Los demás son perfil del lead, no canal.
    const titulos = { fuente: 'Por fuente', compromiso: 'Por nivel de compromiso', ingles: 'Por nivel de inglés', track: 'Por campaña' };

    return Object.keys(titulos).map(llave => {
      const mapa = segs[llave];
      if (!mapa || !Object.keys(mapa).length) return '';

      // Ordenado por conversión, no por volumen: la pregunta es qué segmento
      // convierte mejor, no cuál tiene más leads.
      const entradas = Object.entries(mapa).sort((a, b) => pct(b[1].trials, b[1].leads) - pct(a[1].trials, a[1].leads));
      const maxPct = Math.max(...entradas.map(([, v]) => pct(v.trials, v.leads)), 1);

      const filas = entradas.map(([nombre, v]) => {
        const p = pct(v.trials, v.leads);
        return `<div class="fila">
          <div>
            <div class="f-nombre">${escapeHtml(nombre)}</div>
            <div class="f-sub">${v.leads} leads · ${v.clicks} clicks · ${v.trials} trials</div>
          </div>
          <div class="f-barra"><span style="width:${(p / maxPct) * 100}%;background:var(--paso-trials)"></span></div>
          <div class="f-pct" style="color:${p ? 'var(--ink)' : 'var(--ink-3)'}">${p}%</div>
        </div>`;
      }).join('');

      // La fuente necesita explicación: solo se puede identificar Google Ads
      // (por el gclid que agrega a sus clics). Todo lo demás cae en una bolsa.
      const nota = llave === 'fuente'
        ? `<div class="nota">El porcentaje es la conversión a trial de cada fuente. Solo se puede identificar Google Ads, porque agrega un parámetro propio a cada clic de sus anuncios. "Meta, orgánico o directo" junta todo lo demás: anuncios de Instagram, link de la bio, búsquedas en Google sin pagar, correos y quien escribe la dirección directo. Empieza a contar desde el 11 ago 2026, así que los leads anteriores caen todos en esa bolsa.</div>`
        : '';

      return `<div class="m-seccion">
        <div class="m-head"><h3>${titulos[llave]}</h3><span class="sub">ordenado por conversión a trial</span></div>
        <div class="filas">${filas}</div>
        ${nota}
      </div>`;
    }).join('');
  }


  // ── Vacantes ──────────────────────────────────────────────────────────
  //
  // Busca vacantes remotas en las bolsas de las empresas que ya conocemos y
  // arma el post para la comunidad. Se pueden desmarcar las que no sirvan
  // antes de copiar: el filtro automático es bueno pero no perfecto.

  let VACANTES = null;

  function pintarVacantes() {
    const cont = document.getElementById('vistaVacantes');
    if (VACANTES) return; // ya cargadas, no re-pintar y perder lo desmarcado

    cont.innerHTML = `
      <div class="vac-head">
        <h2>Vacantes para la comunidad</h2>
        <p>Busca vacantes remotas abiertas a México y LATAM en las bolsas de las empresas que ya publicamos. Revisa la lista, quita las que no sirvan y copia el post.</p>
        <div class="vac-acciones">
          <button class="vac-btn" id="btnBuscar" onclick="buscarVacantes()">Buscar vacantes</button>
        </div>
      </div>`;
  }

  async function buscarVacantes() {
    const btn = document.getElementById('btnBuscar');
    btn.disabled = true;
    btn.textContent = 'Buscando...';

    try {
      const resp = await fetch('/api/vacantes?clave=' + encodeURIComponent(CLAVE));
      const d = await resp.json();
      if (!resp.ok || d.error) throw new Error(d.error || 'Error al buscar');

      VACANTES = d;
      elegirTextos();
      renderVacantes();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Buscar vacantes';
      alert('No se pudieron traer las vacantes: ' + err.message);
    }
  }

  function renderVacantes() {
    const d = VACANTES;
    const cont = document.getElementById('vistaVacantes');

    let html = `
      <div class="vac-head">
        <h2>Vacantes para la comunidad</h2>
        <p>${d.total} vacantes seleccionadas de ${d.candidatas} candidatas, sobre ${d.revisadas} revisadas. Las que dicen México o LATAM van primero. Desmarca las que no sirvan y copia el post.</p>
        <div class="vac-acciones">
          <button class="vac-btn" onclick="copiarPost()">Copiar post</button>
          <button class="vac-btn sec" onclick="copiarTitulo()">Copiar título</button>
          <button class="vac-btn sec" onclick="otroMensaje()">Otro mensaje</button>
          <button class="vac-btn sec" onclick="VACANTES=null;pintarVacantes()">Buscar de nuevo</button>
          <span class="vac-loc" id="vacConteo"></span>
        </div>
      </div>`;

    let i = 0;
    for (const [cat, vs] of Object.entries(d.categorias)) {
      if (!vs.length) continue;
      html += `<div class="vac-cat"><h3>${escapeHtml(cat)}</h3>`;
      for (const v of vs) {
        const id = 'v' + (i++);
        // Las primeras 4 de cada categoría vienen marcadas: es el tamaño
        // típico del post. El resto queda disponible por si alguna no sirve.
        const marcada = 'checked'; // ya vienen filtradas al total del post
        html += `
          <div class="vac-item">
            <input type="checkbox" id="${id}" ${marcada}
                   data-cat="${escapeHtml(cat)}"
                   data-emp="${escapeHtml(v.empresa)}"
                   data-tit="${escapeHtml(v.titulo)}"
                   data-url="${escapeHtml(v.url)}"
                   onchange="actualizarConteo()">
            <label for="${id}">
              <span class="vac-emp">${escapeHtml(v.empresa)}</span> - ${escapeHtml(v.titulo)}
              ${v.ubicacion ? `<span class="vac-loc"> · ${escapeHtml(v.ubicacion)}</span>` : ''}
              <br><a href="${escapeHtml(v.url)}" target="_blank" rel="noopener">${escapeHtml(v.url)}</a>
            </label>
          </div>`;
      }
      html += '</div>';
    }

    html += '<div id="vacPost"></div>';
    cont.innerHTML = html;
    actualizarConteo();
  }

  function seleccionadas() {
    return [...document.querySelectorAll('#vistaVacantes input:checked')];
  }

  function actualizarConteo() {
    const n = seleccionadas().length;
    const el = document.getElementById('vacConteo');
    if (el) el.textContent = n + (n === 1 ? ' vacante seleccionada' : ' vacantes seleccionadas');
    const post = document.getElementById('vacPost');
    if (post) {
      post.textContent = `TÍTULO: ${TEXTOS ? TEXTOS.titulo : ''}\n${'─'.repeat(40)}\n\n${armarPost()}`;
    }
  }

  // Variantes del texto del post. Publicando cada semana, el mismo mensaje
  // se lee automatizado para el tercer post. Se elige una al azar cada vez
  // que se busca, y el botón de abajo permite cambiarla si no convence.
  const SALUDOS = [
    'Hola, cómo están?',
    'Buen día a todos!',
    'Qué tal, cómo va la semana?',
    'Hola a todos!',
    'Cómo van por acá?',
    'Buenas! Espero que vayan bien.',
  ];

  const INTROS = [
    'Les comparto unas vacantes que encontramos. Recuerden que la diferencia la hace tener los documentos listos y aplicar con estrategia, tal como lo vemos en el curso.',
    'Estuvimos buscando y salieron varias que valen la pena. Antes de aplicar, revisen que su CV y LinkedIn estén como los trabajamos en el curso: ahí es donde se gana o se pierde el proceso.',
    'Aquí van unas vacantes que encontramos. Ya saben, aplicar sin preparar el perfil es tirar el tiro. Usen las plantillas y la estrategia que vemos adentro.',
    'Les dejo estas oportunidades que salieron. La mayoría de la gente aplica en automático y por eso no le contestan. Ustedes tienen el método, úsenlo.',
    'Estas son algunas vacantes abiertas ahora. Tómense el tiempo de adaptar el CV a cada una, no manden el mismo a todas.',
    'Van unas vacantes que vale la pena revisar. Antes de aplicar, revisen bien la descripción y ajusten su perfil a lo que están pidiendo.',
  ];

  const TITULOS = [
    'Vacantes remotas 💻',
    'Nuevas vacantes remotas 💻',
    'Vacantes abiertas ahora 💻',
    'Vacantes que encontramos 💻',
    'Oportunidades remotas 💻',
  ];

  const CIERRES = [
    'Mucho éxito a todos. Cualquier duda sobre cómo aplicar, la vemos en las sesiones.',
    'Si alguna les interesa y quieren que revisemos su aplicación, escriban en la comunidad.',
    'Cualquier cosa que necesiten para aplicar, aquí andamos. Éxito!',
    'Ánimo con las aplicaciones. Nos vemos en la sesión de esta semana.',
    'Si aplican a alguna, cuéntennos cómo les fue. Éxito!',
    'A darle. Cualquier duda la resolvemos en la comunidad.',
  ];

  let TEXTOS = null;

  function elegirTextos() {
    const al = a => a[Math.floor(Math.random() * a.length)];
    TEXTOS = { titulo: al(TITULOS), saludo: al(SALUDOS), intro: al(INTROS), cierre: al(CIERRES) };
  }

  function otroMensaje() {
    elegirTextos();
    actualizarConteo();
  }

  function armarPost() {
    if (!TEXTOS) elegirTextos();

    const porCat = {};
    for (const c of seleccionadas()) {
      const cat = c.dataset.cat;
      (porCat[cat] = porCat[cat] || []).push(c);
    }

    // Cada vacante en UNA sola línea, con guion al inicio.
    //
    // Skool convierte cada salto de línea en un párrafo con su propio
    // espaciado, así que separar el puesto del link en dos líneas dejaba el
    // post larguísimo y con huecos. Con todo en una línea el post queda
    // compacto y el link sigue siendo clickeable.
    let out = `${TEXTOS.saludo}\n${TEXTOS.intro}\n`;

    for (const [cat, items] of Object.entries(porCat)) {
      out += `\n${cat}\n`;
      for (const c of items) {
        out += `- ${c.dataset.emp} - ${c.dataset.tit}: ${c.dataset.url}\n`;
      }
    }

    out += `\n${TEXTOS.cierre}`;
    return out.trim();
  }

  // Copia el post conservando los saltos de línea.
  //
  // El editor de Skool pega el texto plano como un solo párrafo corrido: los
  // \n se pierden y quedan las 10 vacantes en un bloque ilegible. La salida
  // es ponerlo también como HTML con <br> reales, que Skool sí respeta. El
  // navegador ofrece los dos formatos y el destino toma el que entiende.
  async function copiarPost() {
    const btn = event.target;
    const original = btn.textContent;
    const texto = armarPost();

    const html = texto
      .split('\n')
      .map(l => l.trim() === '' ? '<br>' : escapeHtml(l))
      .join('<br>');

    try {
      if (navigator.clipboard.write && window.ClipboardItem) {
        await navigator.clipboard.write([
          new ClipboardItem({
            'text/html':  new Blob([html],  { type: 'text/html' }),
            'text/plain': new Blob([texto], { type: 'text/plain' }),
          }),
        ]);
      } else {
        await navigator.clipboard.writeText(texto);
      }
      btn.textContent = 'Copiado';
      setTimeout(() => { btn.textContent = original; }, 1800);
    } catch (err) {
      // Respaldo para navegadores que no dejan escribir HTML al portapapeles
      try {
        await navigator.clipboard.writeText(texto);
        btn.textContent = 'Copiado (texto)';
        setTimeout(() => { btn.textContent = original; }, 1800);
      } catch (e) {
        alert('No se pudo copiar. Selecciona el texto de abajo y cópialo a mano.');
      }
    }
  }

  async function copiarTitulo() {
    const btn = event.target;
    const original = btn.textContent;
    try {
      await navigator.clipboard.writeText(TEXTOS.titulo);
      btn.textContent = 'Copiado';
      setTimeout(() => { btn.textContent = original; }, 1800);
    } catch (err) {
      alert('Título: ' + TEXTOS.titulo);
    }
  }

  function formatearHora(iso) {
    const d = new Date(iso);
    return d.toLocaleString('es-MX', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>
